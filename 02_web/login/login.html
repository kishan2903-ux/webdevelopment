<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Log In - LETS SHOP</title>
  <link rel="stylesheet" href="css_1.css">
</head>
<body>

  <!-- Header -->
  <header class="navbar">
    <a href="home.html" class="logo">LETS SHOP</a>
    <a href="home.html" class="nav-btn">Back to Home</a>
  </header>

  <!-- Login Form Section -->
  <main class="auth-wrapper">
    <div class="auth-card">
      <h2>Welcome Back</h2>
      <p class="subtitle">Log in to your LETS SHOP account</p>

      <!-- Redirects to home.html with #logged-in state -->
      <form action="home.html#logged-in">
        <div class="form-group">
          <label for="email">Email Address</label>
          <input type="email" id="email" placeholder="Enter your email" required />
        </div>

        <div class="form-group">
          <label for="password">Password</label>
          <input type="password" id="password" placeholder="Enter your password" required />
        </div>

        <button type="submit" class="submit-btn">Log In</button>
      </form>

      <p class="switch-link">
        Don't have an account? <a href="signup.html">Sign Up</a>
      </p>
    </div>
  </main>

</body>
</html>
